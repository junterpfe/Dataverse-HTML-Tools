<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flow Dependency Viewer</title>
  <script src="../ClientGlobalContext.js.aspx" type="text/javascript"></script>
  <script>
    (() => {
      const theme = hasDarkModeFlag() ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", theme);

      function hasDarkModeFlag() {
        return getUrlCandidates().some(urlHasDarkModeFlag);
      }

      function getUrlCandidates() {
        const urls = [window.location.href, document.referrer];

        try {
          urls.push(window.parent.location.href);
        } catch (error) {
          // Parent can be cross-origin in some host shells.
        }

        try {
          urls.push(window.top.location.href);
        } catch (error) {
          // Top can be cross-origin in some host shells.
        }

        return urls.filter(Boolean);
      }

      function urlHasDarkModeFlag(url) {
        const text = normalizeUrlText(url);
        return text.includes("themeoption=darkmode") || text.includes("themeoption%3ddarkmode");
      }

      function normalizeUrlText(value) {
        let text = String(value || "").toLowerCase();

        for (let index = 0; index < 3; index += 1) {
          try {
            const decoded = decodeURIComponent(text);
            if (decoded === text) {
              break;
            }
            text = decoded;
          } catch (error) {
            break;
          }
        }

        return text;
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --cp-bg: #f7f4ef;
      --cp-bg-elevated: #fcfbf8;
      --cp-surface: #ffffff;
      --cp-surface-soft: #f5f5f5;
      --cp-border: #dedede;
      --cp-border-strong: #919191;
      --cp-text: #242424;
      --cp-text-muted: #5c5c5c;
      --cp-text-soft: #6f6f6f;
      --cp-accent: #b11f4b;
      --cp-accent-hover: #9a1a41;
      --cp-accent-soft: rgba(177, 31, 75, 0.08);
      --cp-accent-fg: #ffffff;
      --cp-success: #16a34a;
      --cp-danger: #dc2626;
      --cp-warning: #f59e0b;
      --cp-link: #0078d4;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
      --cp-overlay: rgba(255, 255, 255, 0.8);
      --cp-panel: rgba(255, 255, 255, 0.86);
      --cp-panel-strong: rgba(255, 255, 255, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.55);
      --cp-highlight: rgba(177, 31, 75, 0.12);
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --cp-bg: #3d3b3a;
      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;
      --cp-accent-soft: rgba(253, 142, 161, 0.14);
      --cp-accent-fg: #1a1a1a;
      --cp-success: #4ade80;
      --cp-danger: #f87171;
      --cp-warning: #fbbf24;
      --cp-link: #4da6ff;
      --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
      --cp-overlay: rgba(41, 41, 41, 0.88);
      --cp-panel: rgba(41, 41, 41, 0.72);
      --cp-panel-strong: rgba(41, 41, 41, 0.96);
      --cp-sheen: rgba(255, 255, 255, 0.04);
      --cp-highlight: rgba(253, 142, 161, 0.12);
    }
    html,
    body {
      background: var(--cp-bg);
      color: var(--cp-text);
      font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100%;
      margin: 0;
    }
    * {
      box-sizing: border-box;
    }
    button,
    input,
    textarea {
      font: inherit;
    }
    .fdv-root {
      min-height: 100%;
      padding: 0.5rem;
    }
    .fdv-shell {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: calc(100vh - 1rem);
      padding: 0.75rem;
    }
    .fdv-header {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: space-between;
    }
    .fdv-title-block {
      min-width: 16rem;
    }
    .fdv-title {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.3;
      margin: 0;
    }
    .fdv-subtitle {
      color: var(--cp-text-muted);
      font-size: 0.875rem;
      margin: 0.25rem 0 0;
    }
    .fdv-toolbar {
      align-items: flex-end;
      display: flex;
      flex: 1 1 40rem;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: flex-end;
    }
    .fdv-field {
      display: flex;
      flex: 1 1 18rem;
      flex-direction: column;
      gap: 0.25rem;
      max-width: 28rem;
    }
    .fdv-solution-field {
      flex: 999 1 32rem;
      max-width: none;
    }
    .fdv-field label {
      color: var(--cp-text-muted);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .fdv-input {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      color: var(--cp-text);
      min-height: 2.25rem;
      padding: 0.45rem 0.65rem;
      width: 100%;
    }
    .fdv-input:focus {
      border-color: var(--cp-accent);
      outline: 2px solid var(--cp-accent-soft);
    }
    .fdv-picker {
      position: relative;
      width: 100%;
    }
    .fdv-picker-panel {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      box-shadow: var(--cp-shadow);
      left: 0;
      max-height: 18rem;
      overflow: auto;
      padding: 0.25rem;
      position: absolute;
      right: 0;
      top: calc(100% + 0.25rem);
      z-index: 10;
    }
    .fdv-picker-panel[hidden] {
      display: none;
    }
    .fdv-picker-option {
      background: var(--cp-surface);
      border: 1px solid var(--cp-surface);
      border-radius: 0.625rem;
      color: var(--cp-text);
      cursor: pointer;
      display: block;
      padding: 0.5rem 0.6rem;
      text-align: left;
      width: 100%;
    }
    .fdv-picker-option:hover,
    .fdv-picker-option:focus {
      background: var(--cp-accent-soft);
      border-color: var(--cp-accent);
      outline: none;
    }
    .fdv-picker-empty {
      color: var(--cp-text-muted);
      font-size: 0.875rem;
      padding: 0.6rem;
    }
    .fdv-button {
      align-items: center;
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      color: var(--cp-text);
      cursor: pointer;
      display: inline-flex;
      font-size: 0.875rem;
      font-weight: 600;
      gap: 0.35rem;
      justify-content: center;
      min-height: 2.25rem;
      padding: 0.45rem 0.75rem;
    }
    .fdv-button:hover:not(:disabled) {
      border-color: var(--cp-border-strong);
    }
    .fdv-button:disabled {
      color: var(--cp-text-muted);
      cursor: not-allowed;
      opacity: 0.65;
    }
    .fdv-button-primary {
      background: var(--cp-accent);
      border-color: var(--cp-accent);
      color: var(--cp-accent-fg);
    }
    .fdv-button-danger {
      border-color: var(--cp-danger);
      color: var(--cp-danger);
    }
    .fdv-message {
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      color: var(--cp-text);
      font-size: 0.875rem;
      padding: 0.65rem 0.75rem;
    }
    .fdv-message-info,
    .fdv-message-success {
      background: var(--cp-accent-soft);
    }
    .fdv-message-warning {
      border-color: var(--cp-warning);
    }
    .fdv-message-error {
      border-color: var(--cp-danger);
    }
    .fdv-stats {
      display: grid;
      gap: 0.75rem;
      grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr));
    }
    .fdv-stat {
      background: var(--cp-surface-soft);
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      padding: 0.75rem;
    }
    .fdv-stat-value {
      font-size: 1.3rem;
      font-weight: 700;
    }
    .fdv-stat-label {
      color: var(--cp-text-muted);
      font-size: 0.75rem;
      margin-top: 0.15rem;
    }
    .fdv-content-grid {
      display: grid;
      gap: 1rem;
      grid-template-columns: minmax(0, 1fr);
    }
    .fdv-card {
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      overflow: hidden;
    }
    .fdv-card-header {
      align-items: center;
      background: var(--cp-surface-soft);
      border-bottom: 1px solid var(--cp-border);
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: space-between;
      padding: 0.75rem;
    }
    .fdv-card-title {
      font-size: 1rem;
      font-weight: 600;
    }
    .fdv-table-wrap {
      overflow: auto;
    }
    .fdv-table {
      border-collapse: collapse;
      min-width: 70rem;
      width: 100%;
    }
    .fdv-table th,
    .fdv-table td {
      border-bottom: 1px solid var(--cp-border);
      padding: 0.65rem 0.75rem;
      text-align: left;
      vertical-align: top;
    }
    .fdv-table th:last-child,
    .fdv-table td:last-child {
      background: var(--cp-surface);
      box-shadow: -1px 0 0 var(--cp-border);
      min-width: 7rem;
      position: sticky;
      right: 0;
      z-index: 2;
    }
    .fdv-table th:last-child {
      background: var(--cp-surface-soft);
      z-index: 3;
    }
    .fdv-table th {
      color: var(--cp-text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }
    .fdv-table tr.fd-selected td {
      background: var(--cp-accent-soft);
    }
    .fdv-table tr.fd-selected td:last-child {
      background: var(--cp-accent-soft);
    }
    .fdv-table tr.fd-highlight td {
      background: var(--cp-highlight);
    }
    .fdv-table tr.fd-highlight td:last-child {
      background: var(--cp-highlight);
    }
    .fdv-flow-name {
      font-weight: 600;
    }
    .fdv-flow-link {
      background: none;
      border: 0;
      color: var(--cp-link);
      cursor: pointer;
      font-weight: 600;
      padding: 0;
      text-align: left;
      text-decoration: underline;
    }
    .fdv-flow-link:hover,
    .fdv-flow-link:focus {
      color: var(--cp-accent);
      outline: none;
    }
    .fdv-flow-meta {
      color: var(--cp-text-muted);
      font-family: Consolas, "Courier New", Courier, monospace;
      font-size: 0.72rem;
      margin-top: 0.2rem;
    }
    .fdv-badge {
      border: 1px solid var(--cp-border);
      border-radius: 999rem;
      display: inline-flex;
      font-size: 0.75rem;
      font-weight: 700;
      line-height: 1;
      padding: 0.28rem 0.45rem;
      white-space: nowrap;
    }
    .fdv-badge-on {
      border-color: var(--cp-success);
    }
    .fdv-badge-off {
      border-color: var(--cp-text-muted);
    }
    .fdv-badge-warning {
      border-color: var(--cp-warning);
    }
    .fdv-badge-error {
      border-color: var(--cp-danger);
    }
    .fdv-chip-list {
      align-items: flex-start;
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .fdv-chip {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 999rem;
      color: var(--cp-text);
      cursor: pointer;
      font-size: 0.75rem;
      padding: 0.25rem 0.45rem;
    }
    .fdv-chip:hover {
      border-color: var(--cp-accent);
    }
    .fdv-chip-external {
      border-color: var(--cp-danger);
      color: var(--cp-danger);
    }
    .fdv-chip-error {
      border-color: var(--cp-danger);
      color: var(--cp-danger);
    }
    .fdv-button-danger:hover:not(:disabled) {
      border-color: var(--cp-danger);
      font-weight: 700;
    }
    .fdv-muted {
      color: var(--cp-text-muted);
    }
    .fdv-actions {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    .fdv-empty {
      color: var(--cp-text-muted);
      padding: 1rem;
    }
    .fdv-match-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      padding: 0.75rem;
    }
    .fdv-match {
      align-items: center;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      display: flex;
      gap: 0.75rem;
      justify-content: space-between;
      padding: 0.6rem 0.75rem;
    }
    .fdv-dialog-backdrop {
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      bottom: 0;
      display: flex;
      justify-content: center;
      left: 0;
      padding: 1rem;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 1000;
    }
    .fdv-dialog {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 0.75rem;
      box-shadow: var(--cp-shadow);
      max-height: calc(100vh - 2rem);
      max-width: 42rem;
      overflow: auto;
      width: min(42rem, 100%);
    }
    .fdv-dialog-header,
    .fdv-dialog-footer {
      align-items: center;
      display: flex;
      gap: 0.5rem;
      justify-content: space-between;
      padding: 0.75rem;
    }
    .fdv-dialog-header {
      border-bottom: 1px solid var(--cp-border);
    }
    .fdv-dialog-footer {
      border-top: 1px solid var(--cp-border);
      flex-wrap: wrap;
    }
    .fdv-dialog-title {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
    }
    .fdv-dialog-body {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding: 0.75rem;
    }
    .fdv-detail-grid {
      display: grid;
      gap: 0.5rem;
      grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
    }
    .fdv-detail {
      background: var(--cp-surface-soft);
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      padding: 0.6rem;
    }
    .fdv-detail-label {
      color: var(--cp-text-muted);
      font-size: 0.75rem;
      font-weight: 600;
    }
    .fdv-detail-value {
      font-size: 0.875rem;
      margin-top: 0.15rem;
      overflow-wrap: anywhere;
    }
    .fdv-textarea {
      background: var(--cp-surface);
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      color: var(--cp-text);
      min-height: 7rem;
      padding: 0.55rem 0.65rem;
      resize: vertical;
      width: 100%;
    }
    .fdv-textarea:focus {
      border-color: var(--cp-accent);
      outline: 2px solid var(--cp-accent-soft);
    }
    @media (max-width: 62rem) {
      .fdv-header,
      .fdv-toolbar {
        align-items: stretch;
        flex-direction: column;
      }
      .fdv-title-block,
      .fdv-toolbar,
      .fdv-picker,
      .fdv-input {
        min-width: 0;
      }
      .fdv-toolbar {
        flex: 0 1 auto;
      }
      .fdv-field,
      .fdv-solution-field {
        flex-basis: auto;
        max-width: none;
        width: 100%;
      }
      .fdv-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main id="app" class="fdv-root"></main>
  <script>
    (() => {
      "use strict";

      const WORKFLOW_COMPONENT_TYPE = 29;
      const ENVIRONMENT_VARIABLE_DEFINITION_COMPONENT_TYPE = 380;
      const ENVIRONMENT_VARIABLE_VALUE_COMPONENT_TYPE = 381;
      const ENVIRONMENT_VARIABLE_TYPE_NUMBER = 100000001;
      const ENVIRONMENT_VARIABLE_TYPE_SECRET = 100000005;
      const CLOUD_FLOW_CATEGORY = 5;
      const ACTIVE_STATE = 1;
      const ACTIVE_STATUS = 2;
      const DRAFT_STATE = 0;
      const DRAFT_STATUS = 1;
      const DEFAULT_PAGE_SIZE = 5000;
      const FETCH_CHUNK_SIZE = 80;

      const state = {
        solutionQuery: "",
        searchQuery: "",
        currentSolution: null,
        solutionMatches: [],
        solutionPickerResults: [],
        solutionPickerError: "",
        isSolutionPickerOpen: false,
        isSearchingSolutions: false,
        solutionSearchTimer: 0,
        solutionSearchRequestId: 0,
        defaultSolution: null,
        flows: new Map(),
        dependencies: [],
        environmentVariables: new Map(),
        environmentVariableDependencies: [],
        environmentVariableEditor: null,
        selectedFlowId: null,
        highlightedFlowId: null,
        highlightTimer: 0,
        environmentName: "",
        environmentNamePromise: null,
        isLoading: false,
        isWorking: false,
        workingText: "",
        enableActivationCommands: true,
        message: {
          severity: "info",
          text: "Enter a Dataverse solution unique name, friendly name, or solution ID to load cloud flow dependencies."
        }
      };

      const app = document.getElementById("app");
      const initialOptions = readInitialOptions();
      state.solutionQuery = initialOptions.solutionReference || "";
      state.enableActivationCommands = initialOptions.enableActivationCommands;
      state.environmentName = initialOptions.environmentName || "";

      render();
      if (initialOptions.autoLoad && state.solutionQuery) {
        void loadSolution(state.solutionQuery);
      }

      function readInitialOptions() {
        const params = new URLSearchParams(window.location.search);
        const dataParams = new URLSearchParams();
        const data = params.get("data") || "";
        if (data) {
          const decoded = safeDecode(data);
          if (decoded.trim().startsWith("{")) {
            try {
              const parsed = JSON.parse(decoded);
              Object.keys(parsed).forEach((key) => dataParams.set(key, String(parsed[key])));
            } catch (error) {
              dataParams.set("solutionReference", decoded);
            }
          } else {
            new URLSearchParams(decoded).forEach((value, key) => dataParams.set(key, value));
            if (!decoded.includes("=")) {
              dataParams.set("solutionReference", decoded);
            }
          }
        }

        return {
          solutionReference: params.get("solutionReference") || params.get("solution") || dataParams.get("solutionReference") || dataParams.get("solution") || "",
          environmentName: params.get("environmentName") || params.get("environment") || dataParams.get("environmentName") || dataParams.get("environment") || "",
          cloud: params.get("cloud") || dataParams.get("cloud") || "",
          enableActivationCommands: readBooleanOption(params, dataParams, "enableActivationCommands", true),
          autoLoad: readBooleanOption(params, dataParams, "autoLoad", true)
        };
      }

      function readBooleanOption(params, dataParams, name, defaultValue) {
        const value = params.get(name) || dataParams.get(name);
        if (value === null || value === undefined || value === "") {
          return defaultValue;
        }

        return !["false", "0", "no"].includes(value.toLowerCase());
      }

      function safeDecode(value) {
        try {
          return decodeURIComponent(value);
        } catch (error) {
          return value;
        }
      }

      function getXrm() {
        if (window.Xrm && window.Xrm.WebApi) {
          return window.Xrm;
        }

        try {
          if (window.parent && window.parent !== window && window.parent.Xrm && window.parent.Xrm.WebApi) {
            return window.parent.Xrm;
          }
        } catch (error) {
          return null;
        }

        try {
          if (window.top && window.top !== window && window.top.Xrm && window.top.Xrm.WebApi) {
            return window.top.Xrm;
          }
        } catch (error) {
          return null;
        }

        return null;
      }

      function getWebApi() {
        const xrm = getXrm();
        if (!xrm || !xrm.WebApi || typeof xrm.WebApi.retrieveMultipleRecords !== "function") {
          throw new Error("Dataverse Web API is not available. Open this as a model-driven app HTML web resource.");
        }

        return xrm.WebApi;
      }

      function getClientUrl() {
        const xrm = getXrm();
        if (xrm && xrm.Utility && typeof xrm.Utility.getGlobalContext === "function") {
          const globalContext = xrm.Utility.getGlobalContext();
          if (globalContext && typeof globalContext.getClientUrl === "function") {
            return globalContext.getClientUrl();
          }
        }

        return window.location.origin;
      }

      function scheduleSolutionSearch(query, resultsHost) {
        window.clearTimeout(state.solutionSearchTimer);
        state.isSolutionPickerOpen = true;
        state.isSearchingSolutions = true;
        state.solutionPickerError = "";
        renderSolutionPickerResults(resultsHost);

        const requestId = state.solutionSearchRequestId + 1;
        state.solutionSearchRequestId = requestId;
        state.solutionSearchTimer = window.setTimeout(() => {
          void searchSolutionChoices(query, resultsHost, requestId);
        }, 250);
      }

      async function searchSolutionChoices(query, resultsHost, requestId) {
        try {
          const solutions = await retrieveSolutionChoices(query);
          if (requestId !== state.solutionSearchRequestId) {
            return;
          }

          state.solutionPickerResults = solutions;
          state.solutionPickerError = "";
        } catch (error) {
          if (requestId !== state.solutionSearchRequestId) {
            return;
          }

          state.solutionPickerResults = [];
          state.solutionPickerError = getErrorMessage(error);
        } finally {
          if (requestId === state.solutionSearchRequestId) {
            state.isSearchingSolutions = false;
            renderSolutionPickerResults(resultsHost);
          }
        }
      }

      async function retrieveSolutionChoices(query) {
        try {
          return await retrieveSolutionChoicesInternal(query, true);
        } catch (error) {
          return retrieveSolutionChoicesInternal(query, false);
        }
      }

      async function retrieveSolutionChoicesInternal(query, includeVisibleFilter) {
        const trimmedQuery = query.trim();
        const filters = [];

        if (includeVisibleFilter) {
          filters.push("isvisible eq true");
        }

        if (trimmedQuery && !normalizeGuid(trimmedQuery)) {
          const escapedQuery = escapeODataString(trimmedQuery);
          filters.push(`(contains(uniquename,'${escapedQuery}') or contains(friendlyname,'${escapedQuery}'))`);
        }

        const filterQuery = filters.length > 0 ? `&$filter=${encodeURIComponent(filters.join(" and "))}` : "";
        const records = await retrieveAll(
          "solution",
          `?$select=solutionid,uniquename,friendlyname,version,ismanaged${includeVisibleFilter ? ",isvisible" : ""}${filterQuery}&$orderby=friendlyname asc&$top=25`
        );

        return records.map(mapSolution).filter((solution) => !!solution.solutionId);
      }

      function renderSolutionPickerResults(resultsHost) {
        if (!resultsHost || !document.body.contains(resultsHost)) {
          return;
        }

        resultsHost.replaceChildren();
        resultsHost.hidden = !state.isSolutionPickerOpen;

        if (!state.isSolutionPickerOpen) {
          return;
        }

        if (state.isSearchingSolutions) {
          resultsHost.appendChild(createElement("div", "fdv-picker-empty", "Searching solutions..."));
          return;
        }

        if (state.solutionPickerError) {
          resultsHost.appendChild(createElement("div", "fdv-picker-empty", `Could not search solutions: ${state.solutionPickerError}`));
          return;
        }

        if (state.solutionPickerResults.length === 0) {
          resultsHost.appendChild(createElement("div", "fdv-picker-empty", "No matching solutions. You can still paste a solution ID or unique name and select Load."));
          return;
        }

        state.solutionPickerResults.forEach((solution) => {
          const option = createElement("button", "fdv-picker-option");
          option.type = "button";
          option.setAttribute("role", "option");
          option.addEventListener("mousedown", (event) => {
            event.preventDefault();
          });
          option.addEventListener("click", () => {
            selectSolution(solution);
          });
          option.appendChild(createElement("div", "fdv-flow-name", solution.friendlyName || solution.uniqueName || solution.solutionId));
          option.appendChild(createElement("div", "fdv-flow-meta", `${solution.uniqueName || "No unique name"} | ${solution.version || "No version"} | ${solution.isManaged ? "managed" : "unmanaged"}`));
          resultsHost.appendChild(option);
        });
      }

      function selectSolution(solution) {
        state.solutionQuery = solution.uniqueName || solution.solutionId;
        state.isSolutionPickerOpen = false;
        state.solutionPickerResults = [];
        render();
        void loadSolution(solution.solutionId);
      }

      async function loadSolution(reference) {
        const trimmedReference = reference.trim();
        if (!trimmedReference) {
          setMessage("warning", "Enter a solution unique name, friendly name, or solution ID before loading.");
          return;
        }

        state.isLoading = true;
        state.solutionMatches = [];
        state.message = { severity: "info", text: `Loading solution "${trimmedReference}"...` };
        render();

        try {
          const solutionResult = await resolveSolution(trimmedReference);
          if (!solutionResult.solution) {
            state.currentSolution = null;
            state.flows = new Map();
            state.dependencies = [];
            state.environmentVariables = new Map();
            state.environmentVariableDependencies = [];
            state.solutionMatches = solutionResult.matches;
            state.message = solutionResult.matches.length > 0
              ? { severity: "warning", text: "Multiple solutions matched. Choose one to load." }
              : { severity: "error", text: `No solution matched "${trimmedReference}".` };
            return;
          }

          const solution = solutionResult.solution;
          const workflowComponentIds = await retrieveSolutionWorkflowIds(solution.solutionId);
          const solutionFlowMap = await retrieveWorkflowMap(workflowComponentIds, true);
          const solutionFlowIds = Array.from(solutionFlowMap.keys());

          if (solutionFlowIds.length === 0) {
            state.currentSolution = solution;
            state.flows = new Map();
            state.dependencies = [];
            state.environmentVariables = new Map();
            state.environmentVariableDependencies = [];
            state.message = { severity: "warning", text: `${getSolutionLabel(solution)} does not contain cloud flows.` };
            return;
          }

          const dependencies = await retrieveFlowDependencies(solutionFlowIds);
          const environmentVariableDependencies = await retrieveEnvironmentVariableDependencies(solutionFlowIds);
          const environmentVariableMap = await retrieveEnvironmentVariableMap(
            distinctNormalizedGuids(environmentVariableDependencies.map((dependency) => dependency.environmentVariableId))
          );
          const externalFlowIds = getExternalFlowIds(solutionFlowMap, dependencies);
          const externalFlowMap = await retrieveWorkflowMap(externalFlowIds, false);

          externalFlowIds.forEach((externalFlowId) => {
            if (!externalFlowMap.has(externalFlowId)) {
              externalFlowMap.set(externalFlowId, createMissingFlow(externalFlowId, false));
            }
          });

          const allFlows = new Map([...solutionFlowMap, ...externalFlowMap]);
          applyDependencies(allFlows, dependencies);
          applyEnvironmentVariableDependencies(allFlows, environmentVariableDependencies);
          computeActivationOrder(allFlows);

          state.currentSolution = solution;
          state.flows = allFlows;
          state.dependencies = dependencies;
          state.environmentVariables = environmentVariableMap;
          state.environmentVariableDependencies = environmentVariableDependencies;
          state.selectedFlowId = state.selectedFlowId && allFlows.has(state.selectedFlowId) ? state.selectedFlowId : solutionFlowIds[0];
          const missingEnvironmentVariableCount = getMissingEnvironmentVariableCount(environmentVariableMap, environmentVariableDependencies);
          state.message = {
            severity: "success",
            text: `Loaded ${solutionFlowIds.length} solution flow${solutionFlowIds.length === 1 ? "" : "s"}, ${dependencies.length} flow-to-flow dependenc${dependencies.length === 1 ? "y" : "ies"}, and ${environmentVariableDependencies.length} environment variable dependenc${environmentVariableDependencies.length === 1 ? "y" : "ies"} for ${getSolutionLabel(solution)}.${missingEnvironmentVariableCount > 0 ? ` ${missingEnvironmentVariableCount} environment variable${missingEnvironmentVariableCount === 1 ? " is" : "s are"} missing values.` : ""}`
          };
        } catch (error) {
          state.message = { severity: "error", text: `Could not load dependencies: ${getErrorMessage(error)}` };
        } finally {
          state.isLoading = false;
          render();
        }
      }

      async function resolveSolution(reference) {
        const solutionId = normalizeGuid(reference);
        if (solutionId) {
          const fetchXml = [
            "<fetch mapping=\"logical\" top=\"1\">",
            "  <entity name=\"solution\">",
            "    <attribute name=\"solutionid\" />",
            "    <attribute name=\"uniquename\" />",
            "    <attribute name=\"friendlyname\" />",
            "    <attribute name=\"version\" />",
            "    <attribute name=\"ismanaged\" />",
            "    <filter>",
            `      <condition attribute="solutionid" operator="eq" value="${escapeXml(solutionId)}" />`,
            "    </filter>",
            "  </entity>",
            "</fetch>"
          ].join("");
          const matches = (await retrieveAll("solution", toFetchXmlQuery(fetchXml))).map(mapSolution);
          return { solution: matches[0] || null, matches };
        }

        const escapedReference = escapeODataString(reference);
        const exactFilter = `uniquename eq '${escapedReference}' or friendlyname eq '${escapedReference}'`;
        const exactMatches = (await retrieveAll(
          "solution",
          `?$select=solutionid,uniquename,friendlyname,version,ismanaged&$filter=${encodeURIComponent(exactFilter)}&$top=5`
        )).map(mapSolution);

        if (exactMatches.length === 1) {
          return { solution: exactMatches[0], matches: [] };
        }

        if (exactMatches.length > 1) {
          return { solution: null, matches: exactMatches };
        }

        const containsFilter = `contains(uniquename,'${escapedReference}') or contains(friendlyname,'${escapedReference}')`;
        const containsMatches = (await retrieveAll(
          "solution",
          `?$select=solutionid,uniquename,friendlyname,version,ismanaged&$filter=${encodeURIComponent(containsFilter)}&$top=10`
        )).map(mapSolution);

        return { solution: containsMatches.length === 1 ? containsMatches[0] : null, matches: containsMatches };
      }

      async function retrieveSolutionWorkflowIds(solutionId) {
        const fetchXml = [
          "<fetch distinct=\"true\" mapping=\"logical\">",
          "  <entity name=\"solutioncomponent\">",
          "    <attribute name=\"objectid\" />",
          "    <filter type=\"and\">",
          `      <condition attribute="solutionid" operator="eq" value="${escapeXml(solutionId)}" />`,
          `      <condition attribute="componenttype" operator="eq" value="${WORKFLOW_COMPONENT_TYPE}" />`,
          "    </filter>",
          "  </entity>",
          "</fetch>"
        ].join("");

        const records = await retrieveAll("solutioncomponent", toFetchXmlQuery(fetchXml));
        return distinctNormalizedGuids(records.map((record) => readString(record, "objectid")));
      }

      async function retrieveWorkflowMap(flowIds, inSolution) {
        const flowMap = new Map();
        const chunks = chunk(flowIds, FETCH_CHUNK_SIZE);

        for (const ids of chunks) {
          if (ids.length === 0) {
            continue;
          }

          const fetchXml = [
            "<fetch mapping=\"logical\">",
            "  <entity name=\"workflow\">",
            "    <attribute name=\"workflowid\" />",
            "    <attribute name=\"name\" />",
            "    <attribute name=\"uniquename\" />",
            "    <attribute name=\"category\" />",
            "    <attribute name=\"statecode\" />",
            "    <attribute name=\"statuscode\" />",
            "    <attribute name=\"resourceid\" />",
            "    <attribute name=\"workflowidunique\" />",
            "    <attribute name=\"modifiedon\" />",
            "    <filter type=\"and\">",
            `      <condition attribute="category" operator="eq" value="${CLOUD_FLOW_CATEGORY}" />`,
            buildInCondition("workflowid", ids),
            "    </filter>",
            "  </entity>",
            "</fetch>"
          ].join("");

          const records = await retrieveAll("workflow", toFetchXmlQuery(fetchXml));
          records.forEach((record) => {
            const flow = mapFlow(record, inSolution);
            if (flow.id) {
              flowMap.set(flow.id, flow);
            }
          });
        }

        return flowMap;
      }

      async function retrieveFlowDependencies(solutionFlowIds) {
        const edgeMap = new Map();
        const chunks = chunk(solutionFlowIds, FETCH_CHUNK_SIZE);

        for (const ids of chunks) {
          const fetchXml = [
            "<fetch distinct=\"true\" mapping=\"logical\">",
            "  <entity name=\"dependency\">",
            "    <attribute name=\"requiredcomponentobjectid\" />",
            "    <attribute name=\"dependentcomponentobjectid\" />",
            "    <attribute name=\"requiredcomponenttype\" />",
            "    <attribute name=\"dependentcomponenttype\" />",
            "    <filter type=\"and\">",
            `      <condition attribute="requiredcomponenttype" operator="eq" value="${WORKFLOW_COMPONENT_TYPE}" />`,
            `      <condition attribute="dependentcomponenttype" operator="eq" value="${WORKFLOW_COMPONENT_TYPE}" />`,
            "      <filter type=\"or\">",
            buildInCondition("requiredcomponentobjectid", ids),
            buildInCondition("dependentcomponentobjectid", ids),
            "      </filter>",
            "    </filter>",
            "  </entity>",
            "</fetch>"
          ].join("");

          const records = await retrieveAll("dependency", toFetchXmlQuery(fetchXml));
          records.forEach((record) => {
            const requiredId = normalizeGuid(readString(record, "requiredcomponentobjectid"));
            const dependentId = normalizeGuid(readString(record, "dependentcomponentobjectid"));
            if (!requiredId || !dependentId || requiredId === dependentId) {
              return;
            }

            edgeMap.set(`${requiredId}|${dependentId}`, { requiredId, dependentId });
          });
        }

        return Array.from(edgeMap.values());
      }

      async function retrieveEnvironmentVariableDependencies(solutionFlowIds) {
        const rawDependencies = new Map();
        const valueIds = new Set();
        const chunks = chunk(solutionFlowIds, FETCH_CHUNK_SIZE);

        for (const ids of chunks) {
          if (ids.length === 0) {
            continue;
          }

          const fetchXml = [
            "<fetch distinct=\"true\" mapping=\"logical\">",
            "  <entity name=\"dependency\">",
            "    <attribute name=\"requiredcomponentobjectid\" />",
            "    <attribute name=\"dependentcomponentobjectid\" />",
            "    <attribute name=\"requiredcomponenttype\" />",
            "    <attribute name=\"dependentcomponenttype\" />",
            "    <filter type=\"and\">",
            `      <condition attribute="dependentcomponenttype" operator="eq" value="${WORKFLOW_COMPONENT_TYPE}" />`,
            buildInCondition("requiredcomponenttype", [ENVIRONMENT_VARIABLE_DEFINITION_COMPONENT_TYPE, ENVIRONMENT_VARIABLE_VALUE_COMPONENT_TYPE]),
            buildInCondition("dependentcomponentobjectid", ids),
            "    </filter>",
            "  </entity>",
            "</fetch>"
          ].join("");

          const records = await retrieveAll("dependency", toFetchXmlQuery(fetchXml));
          records.forEach((record) => {
            const flowId = normalizeGuid(readString(record, "dependentcomponentobjectid"));
            const requiredId = normalizeGuid(readString(record, "requiredcomponentobjectid"));
            const requiredType = readNumber(record, "requiredcomponenttype");
            if (!flowId || !requiredId) {
              return;
            }

            if (requiredType === ENVIRONMENT_VARIABLE_DEFINITION_COMPONENT_TYPE) {
              rawDependencies.set(`${flowId}|definition|${requiredId}`, {
                flowId,
                requiredComponentId: requiredId,
                requiredComponentType: requiredType
              });
            } else if (requiredType === ENVIRONMENT_VARIABLE_VALUE_COMPONENT_TYPE) {
              valueIds.add(requiredId);
              rawDependencies.set(`${flowId}|value|${requiredId}`, {
                flowId,
                requiredComponentId: requiredId,
                requiredComponentType: requiredType
              });
            }
          });
        }

        const valueDefinitionMap = await retrieveEnvironmentVariableValueDefinitionMap(Array.from(valueIds));
        const dependencyMap = new Map();
        rawDependencies.forEach((dependency) => {
          const environmentVariableId = dependency.requiredComponentType === ENVIRONMENT_VARIABLE_VALUE_COMPONENT_TYPE
            ? valueDefinitionMap.get(dependency.requiredComponentId)
            : dependency.requiredComponentId;

          if (environmentVariableId) {
            dependencyMap.set(`${dependency.flowId}|${environmentVariableId}`, {
              flowId: dependency.flowId,
              environmentVariableId
            });
          }
        });

        return Array.from(dependencyMap.values());
      }

      async function retrieveEnvironmentVariableValueDefinitionMap(valueIds) {
        const valueDefinitionMap = new Map();
        const chunks = chunk(valueIds, FETCH_CHUNK_SIZE);

        for (const ids of chunks) {
          if (ids.length === 0) {
            continue;
          }

          const fetchXml = [
            "<fetch mapping=\"logical\">",
            "  <entity name=\"environmentvariablevalue\">",
            "    <attribute name=\"environmentvariablevalueid\" />",
            "    <attribute name=\"environmentvariabledefinitionid\" />",
            "    <filter type=\"and\">",
            buildInCondition("environmentvariablevalueid", ids),
            "    </filter>",
            "  </entity>",
            "</fetch>"
          ].join("");

          const records = await retrieveAll("environmentvariablevalue", toFetchXmlQuery(fetchXml));
          records.forEach((record) => {
            const valueId = normalizeGuid(readString(record, "environmentvariablevalueid"));
            const definitionId = normalizeGuid(
              readString(record, "_environmentvariabledefinitionid_value") || readString(record, "environmentvariabledefinitionid")
            );
            if (valueId && definitionId) {
              valueDefinitionMap.set(valueId, definitionId);
            }
          });
        }

        return valueDefinitionMap;
      }

      async function retrieveEnvironmentVariableMap(environmentVariableIds) {
        const environmentVariableMap = new Map();
        const chunks = chunk(environmentVariableIds, FETCH_CHUNK_SIZE);

        for (const ids of chunks) {
          if (ids.length === 0) {
            continue;
          }

          const fetchXml = [
            "<fetch mapping=\"logical\">",
            "  <entity name=\"environmentvariabledefinition\">",
            "    <attribute name=\"environmentvariabledefinitionid\" />",
            "    <attribute name=\"schemaname\" />",
            "    <attribute name=\"displayname\" />",
            "    <attribute name=\"type\" />",
            "    <filter type=\"and\">",
            buildInCondition("environmentvariabledefinitionid", ids),
            "    </filter>",
            "  </entity>",
            "</fetch>"
          ].join("");

          const records = await retrieveAll("environmentvariabledefinition", toFetchXmlQuery(fetchXml));
          records.forEach((record) => {
            const environmentVariable = mapEnvironmentVariable(record);
            if (environmentVariable.id) {
              environmentVariableMap.set(environmentVariable.id, environmentVariable);
            }
          });
        }

        const defaultValueMap = await retrieveEnvironmentVariableDefaultValueMap(environmentVariableIds);
        const currentValueMap = await retrieveEnvironmentVariableCurrentValueMap(environmentVariableIds);
        environmentVariableMap.forEach((environmentVariable) => {
          const currentValue = currentValueMap.get(environmentVariable.id);
          environmentVariable.hasDefaultValue = defaultValueMap.get(environmentVariable.id) === true;
          environmentVariable.currentValueId = currentValue ? currentValue.valueId : "";
          environmentVariable.hasCurrentValue = currentValue ? currentValue.hasValue : false;
          environmentVariable.hasValue = environmentVariable.hasCurrentValue || environmentVariable.hasDefaultValue;
        });

        environmentVariableIds.forEach((environmentVariableId) => {
          if (!environmentVariableMap.has(environmentVariableId)) {
            environmentVariableMap.set(environmentVariableId, createMissingEnvironmentVariable(environmentVariableId));
          }
        });

        return environmentVariableMap;
      }

      async function retrieveEnvironmentVariableDefaultValueMap(environmentVariableIds) {
        const defaultValueMap = new Map();
        const chunks = chunk(environmentVariableIds, FETCH_CHUNK_SIZE);

        for (const ids of chunks) {
          if (ids.length === 0) {
            continue;
          }

          const fetchXml = [
            "<fetch distinct=\"true\" mapping=\"logical\">",
            "  <entity name=\"environmentvariabledefinition\">",
            "    <attribute name=\"environmentvariabledefinitionid\" />",
            "    <filter type=\"and\">",
            buildInCondition("environmentvariabledefinitionid", ids),
            "      <condition attribute=\"defaultvalue\" operator=\"not-null\" />",
            "    </filter>",
            "  </entity>",
            "</fetch>"
          ].join("");

          const records = await retrieveAll("environmentvariabledefinition", toFetchXmlQuery(fetchXml));
          records.forEach((record) => {
            const definitionId = normalizeGuid(readString(record, "environmentvariabledefinitionid"));
            if (definitionId) {
              defaultValueMap.set(definitionId, true);
            }
          });
        }

        return defaultValueMap;
      }

      async function retrieveEnvironmentVariableCurrentValueMap(environmentVariableIds) {
        const currentValueMap = new Map();
        const chunks = chunk(environmentVariableIds, FETCH_CHUNK_SIZE);

        for (const ids of chunks) {
          if (ids.length === 0) {
            continue;
          }

          const fetchXml = [
            "<fetch mapping=\"logical\">",
            "  <entity name=\"environmentvariablevalue\">",
            "    <attribute name=\"environmentvariablevalueid\" />",
            "    <attribute name=\"environmentvariabledefinitionid\" />",
            "    <attribute name=\"statecode\" />",
            "    <attribute name=\"modifiedon\" />",
            "    <filter type=\"and\">",
            buildInCondition("environmentvariabledefinitionid", ids),
            "      <condition attribute=\"statecode\" operator=\"eq\" value=\"0\" />",
            "      <condition attribute=\"value\" operator=\"not-null\" />",
            "    </filter>",
            "  </entity>",
            "</fetch>"
          ].join("");

          const records = await retrieveAll("environmentvariablevalue", toFetchXmlQuery(fetchXml));
          records.forEach((record) => {
            const valueId = normalizeGuid(readString(record, "environmentvariablevalueid"));
            const definitionId = normalizeGuid(
              readString(record, "_environmentvariabledefinitionid_value") || readString(record, "environmentvariabledefinitionid")
            );
            if (definitionId) {
              const existing = currentValueMap.get(definitionId);
              if (!existing || readString(record, "modifiedon") > existing.modifiedOn) {
                currentValueMap.set(definitionId, {
                  valueId: valueId || "",
                  hasValue: true,
                  modifiedOn: readString(record, "modifiedon")
                });
              }
            }
          });
        }

        return currentValueMap;
      }

      async function retrieveActiveEnvironmentVariableValue(environmentVariable, includeValue) {
        const valueRecords = await retrieveEnvironmentVariableValueRecords(environmentVariable.id, includeValue);
        const activeValueRecords = valueRecords
          .filter((record) => record.stateCode !== 1)
          .sort((left, right) => {
            if (left.hasValue !== right.hasValue) {
              return left.hasValue ? -1 : 1;
            }

            return right.modifiedOn.localeCompare(left.modifiedOn);
          });

        return {
          valueRecord: activeValueRecords[0] || null,
          activeValueCount: activeValueRecords.length
        };
      }

      async function retrieveEnvironmentVariableValueRecords(environmentVariableId, includeValue) {
        const valueAttribute = includeValue ? "    <attribute name=\"value\" />" : "";
        const fetchXml = [
          "<fetch mapping=\"logical\">",
          "  <entity name=\"environmentvariablevalue\">",
          "    <attribute name=\"environmentvariablevalueid\" />",
          "    <attribute name=\"environmentvariabledefinitionid\" />",
          "    <attribute name=\"schemaname\" />",
          "    <attribute name=\"statecode\" />",
          "    <attribute name=\"statuscode\" />",
          "    <attribute name=\"modifiedon\" />",
          valueAttribute,
          "    <filter type=\"and\">",
          `      <condition attribute="environmentvariabledefinitionid" operator="eq" value="${escapeXml(environmentVariableId)}" />`,
          "    </filter>",
          "  </entity>",
          "</fetch>"
        ].filter(Boolean).join("");

        const records = await retrieveAll("environmentvariablevalue", toFetchXmlQuery(fetchXml));
        return records.map((record) => mapEnvironmentVariableValue(record, includeValue));
      }

      async function retrieveAll(entityName, options) {
        const records = [];
        let nextOptions = options;

        do {
          const result = await getWebApi().retrieveMultipleRecords(entityName, nextOptions, DEFAULT_PAGE_SIZE);
          result.entities.forEach((entity) => records.push(entity));
          nextOptions = result.nextLink ? getOptionsFromNextLink(result.nextLink) : "";
        } while (nextOptions);

        return records;
      }

      function getOptionsFromNextLink(nextLink) {
        const queryIndex = nextLink.indexOf("?");
        return queryIndex >= 0 ? nextLink.slice(queryIndex) : nextLink;
      }

      function applyDependencies(flowMap, dependencies) {
        flowMap.forEach((flow) => {
          flow.dependsOn.clear();
          flow.dependedOnBy.clear();
          flow.environmentVariableIds.clear();
          flow.activationOrder = null;
          flow.hasCycle = false;
        });

        dependencies.forEach((dependency) => {
          const requiredFlow = flowMap.get(dependency.requiredId);
          const dependentFlow = flowMap.get(dependency.dependentId);
          if (requiredFlow && dependentFlow) {
            dependentFlow.dependsOn.add(requiredFlow.id);
            requiredFlow.dependedOnBy.add(dependentFlow.id);
          }
        });
      }

      function applyEnvironmentVariableDependencies(flowMap, dependencies) {
        flowMap.forEach((flow) => {
          flow.environmentVariableIds.clear();
        });

        dependencies.forEach((dependency) => {
          const flow = flowMap.get(dependency.flowId);
          if (flow) {
            flow.environmentVariableIds.add(dependency.environmentVariableId);
          }
        });
      }

      function computeActivationOrder(flowMap) {
        const inDegree = new Map();
        const dependents = new Map();
        const levels = new Map();

        flowMap.forEach((flow) => {
          inDegree.set(flow.id, 0);
          dependents.set(flow.id, []);
          flow.activationOrder = null;
          flow.hasCycle = false;
        });

        flowMap.forEach((flow) => {
          flow.dependsOn.forEach((requiredId) => {
            if (!flowMap.has(requiredId)) {
              return;
            }

            inDegree.set(flow.id, (inDegree.get(flow.id) || 0) + 1);
            dependents.get(requiredId).push(flow.id);
          });
        });

        const queue = Array.from(flowMap.values())
          .filter((flow) => (inDegree.get(flow.id) || 0) === 0)
          .sort(compareFlows)
          .map((flow) => flow.id);

        queue.forEach((id) => levels.set(id, 1));

        let processedCount = 0;
        while (queue.length > 0) {
          const currentId = queue.shift();
          processedCount += 1;
          const currentLevel = levels.get(currentId) || 1;
          const flow = flowMap.get(currentId);
          if (flow) {
            flow.activationOrder = currentLevel;
          }

          const dependentIds = (dependents.get(currentId) || [])
            .map((id) => flowMap.get(id))
            .filter(Boolean)
            .sort(compareFlows)
            .map((dependentFlow) => dependentFlow.id);

          dependentIds.forEach((dependentId) => {
            levels.set(dependentId, Math.max(levels.get(dependentId) || 1, currentLevel + 1));
            const nextDegree = (inDegree.get(dependentId) || 0) - 1;
            inDegree.set(dependentId, nextDegree);
            if (nextDegree === 0) {
              queue.push(dependentId);
            }
          });

          queue.sort((leftId, rightId) => {
            const left = flowMap.get(leftId);
            const right = flowMap.get(rightId);
            return left && right ? compareFlows(left, right) : leftId.localeCompare(rightId);
          });
        }

        if (processedCount === flowMap.size) {
          return;
        }

        flowMap.forEach((flow) => {
          if (flow.activationOrder === null) {
            flow.hasCycle = true;
          }
        });
      }

      function getExternalFlowIds(solutionFlowMap, dependencies) {
        const externalIds = new Set();
        dependencies.forEach((dependency) => {
          if (!solutionFlowMap.has(dependency.requiredId)) {
            externalIds.add(dependency.requiredId);
          }
          if (!solutionFlowMap.has(dependency.dependentId)) {
            externalIds.add(dependency.dependentId);
          }
        });

        return Array.from(externalIds);
      }

      function getActivationPlan(turnOn) {
        const orderedFlows = getSortedFlows()
          .filter((flow) => flow.inSolution && !flow.hasCycle && flow.activationOrder !== null)
          .filter((flow) => isFlowActive(flow) !== turnOn);

        orderedFlows.sort((left, right) => {
          const leftOrder = left.activationOrder || Number.MAX_SAFE_INTEGER;
          const rightOrder = right.activationOrder || Number.MAX_SAFE_INTEGER;
          if (leftOrder !== rightOrder) {
            return turnOn ? leftOrder - rightOrder : rightOrder - leftOrder;
          }

          return compareFlows(left, right);
        });

        const blockedReasons = [];
        const cyclicSolutionFlows = getSortedFlows().filter((flow) => flow.inSolution && flow.hasCycle);
        if (cyclicSolutionFlows.length > 0) {
          blockedReasons.push(`${cyclicSolutionFlows.length} solution flow${cyclicSolutionFlows.length === 1 ? " is" : "s are"} in a circular dependency and cannot be safely ordered.`);
        }

        if (turnOn) {
          const inactiveExternalPrerequisites = getInactiveExternalPrerequisites();
          if (inactiveExternalPrerequisites.length > 0) {
            blockedReasons.push(`${inactiveExternalPrerequisites.length} external prerequisite flow${inactiveExternalPrerequisites.length === 1 ? " is" : "s are"} off. Turn external prerequisites on first or add them to the solution.`);
          }
        }

        return { orderedFlows, blockedReasons };
      }

      function getInactiveExternalPrerequisites() {
        const inactiveExternalPrerequisiteIds = new Set();
        state.flows.forEach((flow) => {
          if (!flow.inSolution) {
            return;
          }

          flow.dependsOn.forEach((requiredId) => {
            const requiredFlow = state.flows.get(requiredId);
            if (requiredFlow && !requiredFlow.inSolution && !isFlowActive(requiredFlow)) {
              inactiveExternalPrerequisiteIds.add(requiredFlow.id);
            }
          });
        });

        return Array.from(inactiveExternalPrerequisiteIds)
          .map((id) => state.flows.get(id))
          .filter(Boolean)
          .sort(compareFlows);
      }

      function getInactivePrerequisites(flow) {
        return Array.from(flow.dependsOn)
          .map((id) => state.flows.get(id))
          .filter((dependency) => dependency && !isFlowActive(dependency))
          .sort(compareFlows);
      }

      async function bulkSetState(turnOn) {
        const plan = getActivationPlan(turnOn);
        if (plan.blockedReasons.length > 0) {
          setMessage("error", plan.blockedReasons.join(" "));
          return;
        }

        if (plan.orderedFlows.length === 0) {
          setMessage("info", turnOn ? "All orderable solution flows are already on." : "All orderable solution flows are already off.");
          return;
        }

        const confirmed = await confirmAction(
          turnOn ? "Turn flows on in order?" : "Turn flows off?",
          `This will ${turnOn ? "turn on" : "turn off"} ${plan.orderedFlows.length} solution flow${plan.orderedFlows.length === 1 ? "" : "s"} one at a time ${turnOn ? "in activation order" : "in reverse activation order"} and stop at the first failure.`,
          turnOn ? "Turn on" : "Turn off"
        );

        if (!confirmed) {
          return;
        }

        state.isWorking = true;
        state.workingText = turnOn ? "Turning flows on in activation order..." : "Turning flows off in reverse activation order...";
        render();

        let updatedCount = 0;
        try {
          for (const flow of plan.orderedFlows) {
            state.workingText = `${turnOn ? "Turning on" : "Turning off"} ${flow.name}...`;
            render();
            await updateFlowState(flow, turnOn);
            updatedCount += 1;
          }

          state.message = {
            severity: "success",
            text: `${turnOn ? "Turned on" : "Turned off"} ${updatedCount} solution flow${updatedCount === 1 ? "" : "s"}.`
          };
        } catch (error) {
          state.message = {
            severity: "error",
            text: `${turnOn ? "Activation" : "Deactivation"} stopped after ${updatedCount} successful update${updatedCount === 1 ? "" : "s"}: ${getFlowStateErrorMessage(error, turnOn)}`
          };
        } finally {
          state.isWorking = false;
          state.workingText = "";
          render();
        }
      }

      async function setSingleFlowState(flow, turnOn) {
        if (flow.hasCycle) {
          setMessage("error", `${flow.name} is in a circular dependency and cannot be safely ordered.`);
          return;
        }

        if (turnOn) {
          const inactivePrerequisites = getInactivePrerequisites(flow);
          if (inactivePrerequisites.length > 0) {
            setMessage("error", `Turn on prerequisite flow${inactivePrerequisites.length === 1 ? "" : "s"} first: ${inactivePrerequisites.map((dependency) => dependency.name).join(", ")}.`);
            return;
          }
        }

        const confirmed = await confirmAction(
          `${turnOn ? "Turn on" : "Turn off"} ${flow.name}?`,
          `This updates the cloud flow row in Dataverse. ${turnOn ? "Activation can fail if required connection references, environment variables, or child flows are not ready." : "Dependent flows may fail while this flow is off."}`,
          turnOn ? "Turn on" : "Turn off"
        );

        if (!confirmed) {
          return;
        }

        state.isWorking = true;
        state.workingText = `${turnOn ? "Turning on" : "Turning off"} ${flow.name}...`;
        render();

        try {
          await updateFlowState(flow, turnOn);
          state.message = { severity: "success", text: `${flow.name} is now ${turnOn ? "on" : "off"}.` };
        } catch (error) {
          state.message = { severity: "error", text: `Could not ${turnOn ? "turn on" : "turn off"} ${flow.name}: ${getFlowStateErrorMessage(error, turnOn)}` };
        } finally {
          state.isWorking = false;
          state.workingText = "";
          render();
        }
      }

      async function updateFlowState(flow, turnOn) {
        if (!flow.inSolution) {
          throw new Error(`${flow.name} is outside the selected solution and was not changed.`);
        }

        await getWebApi().updateRecord("workflow", flow.id, {
          statecode: turnOn ? ACTIVE_STATE : DRAFT_STATE,
          statuscode: turnOn ? ACTIVE_STATUS : DRAFT_STATUS
        });

        flow.stateCode = turnOn ? ACTIVE_STATE : DRAFT_STATE;
        flow.statusCode = turnOn ? ACTIVE_STATUS : DRAFT_STATUS;
        flow.stateLabel = turnOn ? "On" : "Off";
        flow.statusLabel = turnOn ? "Activated" : "Draft";
      }

      async function openFlowDetails(flow) {
        try {
          const url = await buildFlowDetailsUrl(flow);
          if (url) {
            openExternalUrl(url);
            return;
          }

          await openWorkflowRecord(flow);
        } catch (error) {
          try {
            await openWorkflowRecord(flow);
          } catch (fallbackError) {
            setMessage("error", `Could not open ${flow.name}: ${getErrorMessage(error)} ${getErrorMessage(fallbackError)}`);
          }
        }
      }

      async function openEnvironmentVariable(environmentVariable) {
        state.environmentVariableEditor = {
          variableId: environmentVariable.id,
          valueId: "",
          value: "",
          isLoading: true,
          isSaving: false,
          error: "",
          multipleActiveValues: false,
          currentValueHidden: environmentVariable.typeCode === ENVIRONMENT_VARIABLE_TYPE_SECRET
        };
        render();

        try {
          const valueResult = await retrieveActiveEnvironmentVariableValue(environmentVariable, environmentVariable.typeCode !== ENVIRONMENT_VARIABLE_TYPE_SECRET);
          const editor = state.environmentVariableEditor;
          if (!editor || editor.variableId !== environmentVariable.id) {
            return;
          }

          editor.valueId = valueResult.valueRecord ? valueResult.valueRecord.id : "";
          editor.value = valueResult.valueRecord ? valueResult.valueRecord.value : "";
          editor.multipleActiveValues = valueResult.activeValueCount > 1;
          editor.isLoading = false;
        } catch (error) {
          const editor = state.environmentVariableEditor;
          if (editor && editor.variableId === environmentVariable.id) {
            editor.error = `Could not load current value: ${getErrorMessage(error)}`;
            editor.isLoading = false;
          }
        } finally {
          render();
        }
      }

      async function buildFlowDetailsUrl(flow) {
        const environmentName = await getEnvironmentName();
        const flowId = flow.resourceId || flow.workflowIdUnique || flow.id;

        if (!environmentName || !flowId) {
          return "";
        }

        const makerPortalUrl = getPowerAutomatePortalUrl();
        const solutionSegment = state.currentSolution && flow.inSolution
          ? `/solutions/${encodeURIComponent(state.currentSolution.solutionId)}`
          : "";

        return `${makerPortalUrl}/environments/${encodeURIComponent(environmentName)}${solutionSegment}/flows/${encodeURIComponent(flowId)}/details`;
      }

      async function saveEnvironmentVariableEditor() {
        const editor = state.environmentVariableEditor;
        if (!editor || editor.isLoading || editor.isSaving) {
          return;
        }

        const environmentVariable = state.environmentVariables.get(editor.variableId);
        if (!environmentVariable) {
          editor.error = "Environment variable is no longer loaded.";
          render();
          return;
        }

        if (!hasNonEmptyValue(editor.value)) {
          editor.error = "Enter a current value before saving.";
          render();
          return;
        }

        editor.isSaving = true;
        editor.error = "";
        render();

        try {
          const valueId = await upsertEnvironmentVariableCurrentValue(environmentVariable, editor.valueId, editor.value);
          environmentVariable.currentValueId = valueId || editor.valueId;
          environmentVariable.hasCurrentValue = true;
          environmentVariable.hasValue = true;
          state.environmentVariableEditor = null;
          state.message = { severity: "success", text: `Saved current value for ${getEnvironmentVariableLabel(environmentVariable)}.` };
        } catch (error) {
          const currentEditor = state.environmentVariableEditor;
          if (currentEditor && currentEditor.variableId === environmentVariable.id) {
            currentEditor.error = `Could not save current value: ${getErrorMessage(error)}`;
            currentEditor.isSaving = false;
          }
        } finally {
          render();
        }
      }

      async function upsertEnvironmentVariableCurrentValue(environmentVariable, currentValueId, value) {
        const webApi = getWebApi();
        if (currentValueId) {
          if (typeof webApi.updateRecord !== "function") {
            throw new Error("Dataverse Web API updateRecord is not available.");
          }

          await webApi.updateRecord("environmentvariablevalue", currentValueId, {
            value,
            statecode: 0,
            statuscode: 1
          });
          return currentValueId;
        }

        if (typeof webApi.createRecord !== "function") {
          throw new Error("Dataverse Web API createRecord is not available.");
        }

        const result = await webApi.createRecord("environmentvariablevalue", {
          schemaname: buildEnvironmentVariableValueSchemaName(environmentVariable),
          value,
          "EnvironmentVariableDefinitionId@odata.bind": `/environmentvariabledefinitions(${environmentVariable.id})`
        });
        return normalizeGuid(result && (result.id || result.entityReference && result.entityReference.id)) || "";
      }

      function closeEnvironmentVariableEditor() {
        state.environmentVariableEditor = null;
        render();
      }

      async function openEnvironmentVariablesList() {
        const editor = state.environmentVariableEditor;
        if (!editor) {
          return;
        }

        try {
          const url = await buildEnvironmentVariablesListUrl();
          if (!url) {
            throw new Error("Pass the Power Platform environment ID in the environmentName parameter to open the maker Environment variables list.");
          }

          openExternalUrl(url);
        } catch (error) {
          const currentEditor = state.environmentVariableEditor;
          if (currentEditor) {
            currentEditor.error = `Could not open Default Solution Environment variables list: ${getErrorMessage(error)}`;
            render();
          }
        }
      }

      async function buildEnvironmentVariablesListUrl() {
        const environmentName = getPowerPlatformEnvironmentId();
        const defaultSolution = await getDefaultSolution();

        if (!environmentName || !defaultSolution.solutionId) {
          return "";
        }

        return `${getPowerAppsPortalUrl()}/environments/${encodeURIComponent(environmentName)}/solutions/${encodeURIComponent(defaultSolution.solutionId)}/objects/environment%20variables`;
      }

      async function getDefaultSolution() {
        if (state.defaultSolution) {
          return state.defaultSolution;
        }

        state.defaultSolution = await retrieveDefaultSolution();
        return state.defaultSolution;
      }

      async function retrieveDefaultSolution() {
        const filter = "uniquename eq 'Default'";
        const records = await retrieveAll(
          "solution",
          `?$select=solutionid,uniquename,friendlyname,version,ismanaged&$filter=${encodeURIComponent(filter)}&$top=1`
        );
        const solution = records.map(mapSolution)[0];
        if (!solution) {
          throw new Error("Default Solution could not be found.");
        }

        return solution;
      }

      function getPowerAutomatePortalUrl() {
        const configuredCloud = (initialOptions.cloud || "").toLowerCase();
        if (configuredCloud === "gcc") {
          return "https://make.gov.powerautomate.us";
        }
        if (configuredCloud === "gcchigh" || configuredCloud === "gcc-high" || configuredCloud === "high") {
          return "https://make.high.powerautomate.us";
        }
        if (configuredCloud === "dod") {
          return "https://make.powerautomate.appsplatform.us";
        }
        if (configuredCloud === "china" || configuredCloud === "mooncake") {
          return "https://flow.partner.microsoftonline.cn";
        }

        const host = getClientUrlHost();
        if (host.endsWith(".crm9.dynamics.com")) {
          return "https://make.gov.powerautomate.us";
        }
        if (host.endsWith(".microsoftdynamics.us")) {
          return "https://make.high.powerautomate.us";
        }
        if (host.endsWith(".crm.appsplatform.us")) {
          return "https://make.powerautomate.appsplatform.us";
        }
        if (host.endsWith(".crm.dynamics.cn")) {
          return "https://flow.partner.microsoftonline.cn";
        }

        return "https://make.powerautomate.com";
      }

      function getPowerAppsPortalUrl() {
        const configuredCloud = (initialOptions.cloud || "").toLowerCase();
        if (configuredCloud === "gcc") {
          return "https://make.gov.powerapps.us";
        }
        if (configuredCloud === "gcchigh" || configuredCloud === "gcc-high" || configuredCloud === "high") {
          return "https://make.high.powerapps.us";
        }
        if (configuredCloud === "dod") {
          return "https://make.powerapps.appsplatform.us";
        }
        if (configuredCloud === "china" || configuredCloud === "mooncake") {
          return "https://make.powerapps.partner.microsoftonline.cn";
        }

        const host = getClientUrlHost();
        if (host.endsWith(".crm9.dynamics.com")) {
          return "https://make.gov.powerapps.us";
        }
        if (host.endsWith(".microsoftdynamics.us")) {
          return "https://make.high.powerapps.us";
        }
        if (host.endsWith(".crm.appsplatform.us")) {
          return "https://make.powerapps.appsplatform.us";
        }
        if (host.endsWith(".crm.dynamics.cn")) {
          return "https://make.powerapps.partner.microsoftonline.cn";
        }

        return "https://make.powerapps.com";
      }

      function getClientUrlHost() {
        try {
          return new URL(getClientUrl()).hostname.toLowerCase();
        } catch (error) {
          return window.location.hostname.toLowerCase();
        }
      }

      async function getEnvironmentName() {
        if (state.environmentName) {
          return state.environmentName;
        }

        if (state.environmentNamePromise) {
          return state.environmentNamePromise;
        }

        state.environmentNamePromise = retrieveEnvironmentName();
        state.environmentName = await state.environmentNamePromise;
        return state.environmentName;
      }

      async function retrieveEnvironmentName() {
        const records = await retrieveAll("organization", "?$select=organizationid&$top=1");
        const organization = records[0] || {};
        return normalizeGuid(readString(organization, "organizationid")) || "";
      }

      function getPowerPlatformEnvironmentId() {
        const configuredEnvironment = normalizeGuid(state.environmentName || initialOptions.environmentName);
        if (configuredEnvironment) {
          return configuredEnvironment;
        }

        const environmentId = getUrlCandidates()
          .map((url) => {
            const match = normalizeUrlText(url).match(/\/environments\/([0-9a-f-]{36})(?:[/?#]|$)/i);
            return match ? normalizeGuid(match[1]) : "";
          })
          .find(Boolean);

        return environmentId || "";
      }

      function getUrlCandidates() {
        const urls = [window.location.href, document.referrer];

        try {
          urls.push(window.parent.location.href);
        } catch (error) {
          // Parent can be cross-origin in some host shells.
        }

        try {
          urls.push(window.top.location.href);
        } catch (error) {
          // Top can be cross-origin in some host shells.
        }

        return urls.filter(Boolean);
      }

      function normalizeUrlText(value) {
        let text = String(value || "");

        for (let index = 0; index < 3; index += 1) {
          try {
            const decoded = decodeURIComponent(text);
            if (decoded === text) {
              break;
            }
            text = decoded;
          } catch (error) {
            break;
          }
        }

        return text;
      }

      function openExternalUrl(url) {
        const xrm = getXrm();
        if (xrm && xrm.Navigation && typeof xrm.Navigation.openUrl === "function") {
          void xrm.Navigation.openUrl(url, { openInNewWindow: true });
          return;
        }

        window.open(url, "_blank", "noopener,noreferrer");
      }

      async function openWorkflowRecord(flow) {
        const xrm = getXrm();
        if (!xrm || !xrm.Navigation || typeof xrm.Navigation.openForm !== "function") {
          throw new Error("Neither Power Automate URL navigation nor model-driven record navigation is available.");
        }

        await xrm.Navigation.openForm({
          entityName: "workflow",
          entityId: flow.id
        });
      }

      async function openEnvironmentVariableRecord(environmentVariable) {
        const xrm = getXrm();
        if (!xrm || !xrm.Navigation || typeof xrm.Navigation.openForm !== "function") {
          throw new Error("Neither Power Apps URL navigation nor model-driven record navigation is available.");
        }

        await xrm.Navigation.openForm({
          entityName: "environmentvariabledefinition",
          entityId: environmentVariable.id
        });
      }

      function render() {
        app.replaceChildren();
        const shell = createElement("section", "fdv-shell");
        app.appendChild(shell);

        renderHeader(shell);
        renderMessage(shell);

        if (state.solutionMatches.length > 0) {
          renderSolutionMatches(shell);
        }

        renderStats(shell);

        const contentGrid = createElement("div", "fdv-content-grid");
        shell.appendChild(contentGrid);
        renderTable(contentGrid);
        renderEnvironmentVariableEditor();
      }

      function renderHeader(host) {
        const header = createElement("header", "fdv-header");
        host.appendChild(header);

        const titleBlock = createElement("div", "fdv-title-block");
        header.appendChild(titleBlock);
        titleBlock.appendChild(createElement("h1", "fdv-title", "Flow Dependency Viewer"));
        titleBlock.appendChild(createElement("p", "fdv-subtitle", "Model-driven app web resource for flow dependencies, activation order, and flow state controls."));

        const toolbar = createElement("div", "fdv-toolbar");
        header.appendChild(toolbar);

        const solutionField = createElement("div", "fdv-field fdv-solution-field");
        toolbar.appendChild(solutionField);
        solutionField.appendChild(createElement("label", "", "Solution"));
        const picker = createElement("div", "fdv-picker");
        solutionField.appendChild(picker);
        const solutionInput = document.createElement("input");
        solutionInput.className = "fdv-input";
        solutionInput.placeholder = "Search solutions or paste a solution ID";
        solutionInput.value = state.solutionQuery;
        solutionInput.disabled = state.isLoading || state.isWorking;
        solutionInput.setAttribute("role", "combobox");
        solutionInput.setAttribute("aria-autocomplete", "list");
        solutionInput.setAttribute("aria-expanded", String(state.isSolutionPickerOpen));
        const pickerPanel = createElement("div", "fdv-picker-panel");
        pickerPanel.setAttribute("role", "listbox");
        pickerPanel.hidden = true;
        solutionInput.addEventListener("input", () => {
          state.solutionQuery = solutionInput.value;
          scheduleSolutionSearch(solutionInput.value, pickerPanel);
        });
        solutionInput.addEventListener("focus", () => {
          scheduleSolutionSearch(solutionInput.value, pickerPanel);
        });
        solutionInput.addEventListener("keydown", (event) => {
          if (event.key === "Enter") {
            state.isSolutionPickerOpen = false;
            renderSolutionPickerResults(pickerPanel);
            void loadSolution(solutionInput.value);
          } else if (event.key === "Escape") {
            state.isSolutionPickerOpen = false;
            renderSolutionPickerResults(pickerPanel);
          } else if (event.key === "ArrowDown") {
            const firstOption = pickerPanel.querySelector("button");
            if (firstOption) {
              event.preventDefault();
              firstOption.focus();
            }
          }
        });
        solutionField.addEventListener("focusout", () => {
          window.setTimeout(() => {
            if (!solutionField.contains(document.activeElement)) {
              state.isSolutionPickerOpen = false;
              renderSolutionPickerResults(pickerPanel);
            }
          }, 100);
        });
        picker.appendChild(solutionInput);
        picker.appendChild(pickerPanel);
        renderSolutionPickerResults(pickerPanel);

        toolbar.appendChild(createButton("Load", "primary", () => {
          void loadSolution(state.solutionQuery);
        }, state.isLoading || state.isWorking));

        toolbar.appendChild(createButton("Refresh", "secondary", () => {
          const reference = state.currentSolution ? state.currentSolution.solutionId : state.solutionQuery;
          void loadSolution(reference);
        }, state.isLoading || state.isWorking || (!state.currentSolution && !state.solutionQuery)));

        if (state.enableActivationCommands) {
          toolbar.appendChild(createButton("Turn all on in order", "primary", () => {
            void bulkSetState(true);
          }, state.isLoading || state.isWorking || state.flows.size === 0));
          toolbar.appendChild(createButton("Turn all off", "danger", () => {
            void bulkSetState(false);
          }, state.isLoading || state.isWorking || state.flows.size === 0));
        }
      }

      function renderMessage(host) {
        const text = state.isWorking && state.workingText ? state.workingText : state.message.text;
        const severity = state.isWorking ? "info" : state.message.severity;
        host.appendChild(createElement("div", `fdv-message fdv-message-${severity}`, text));
      }

      function renderStats(host) {
        const solutionFlows = getSortedFlows().filter((flow) => flow.inSolution);
        const activeFlows = solutionFlows.filter(isFlowActive);
        const externalFlows = getSortedFlows().filter((flow) => !flow.inSolution);
        const cycleFlows = solutionFlows.filter((flow) => flow.hasCycle);

        const stats = createElement("div", "fdv-stats");
        host.appendChild(stats);
        appendStat(stats, String(solutionFlows.length), "Solution flows");
        appendStat(stats, String(activeFlows.length), "On");
        appendStat(stats, String(solutionFlows.length - activeFlows.length), "Off");
        appendStat(stats, String(state.dependencies.length), "Flow dependencies");
        appendStat(stats, String(state.environmentVariableDependencies.length), "Variable dependencies");
        appendStat(stats, String(getMissingEnvironmentVariableCount()), "Missing values");
        appendStat(stats, String(externalFlows.length), "External flows");
        appendStat(stats, String(cycleFlows.length), "Circular");
      }

      function renderSolutionMatches(host) {
