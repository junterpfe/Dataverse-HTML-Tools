        const card = createElement("section", "fdv-card");
        host.appendChild(card);
        const header = createElement("div", "fdv-card-header");
        header.appendChild(createElement("div", "fdv-card-title", "Matching solutions"));
        card.appendChild(header);

        const list = createElement("div", "fdv-match-list");
        card.appendChild(list);

        state.solutionMatches.forEach((solution) => {
          const match = createElement("div", "fdv-match");
          const label = createElement("div");
          label.appendChild(createElement("div", "fdv-flow-name", getSolutionLabel(solution)));
          label.appendChild(createElement("div", "fdv-flow-meta", `${solution.solutionId} ${solution.isManaged ? "managed" : "unmanaged"}`));
          match.appendChild(label);
          match.appendChild(createButton("Load", "primary", () => {
            state.solutionQuery = solution.uniqueName || solution.solutionId;
            void loadSolution(solution.solutionId);
          }, state.isLoading || state.isWorking));
          list.appendChild(match);
        });
      }

      function renderTable(host) {
        const card = createElement("section", "fdv-card");
        host.appendChild(card);

        const header = createElement("div", "fdv-card-header");
        card.appendChild(header);
        header.appendChild(createElement("div", "fdv-card-title", "Dependency table"));

        const searchField = createElement("div", "fdv-field");
        searchField.style.maxWidth = "22rem";
        searchField.appendChild(createElement("label", "", "Filter flows"));
        const searchInput = document.createElement("input");
        searchInput.className = "fdv-input";
        searchInput.placeholder = "Search by flow, dependency, or variable name";
        searchInput.value = state.searchQuery;
        searchInput.addEventListener("input", () => {
          state.searchQuery = searchInput.value;
          render();
        });
        searchField.appendChild(searchInput);
        header.appendChild(searchField);

        const tableWrap = createElement("div", "fdv-table-wrap");
        card.appendChild(tableWrap);

        const table = document.createElement("table");
        table.className = "fdv-table";
        tableWrap.appendChild(table);

        const thead = document.createElement("thead");
        table.appendChild(thead);
        const headerRow = document.createElement("tr");
        thead.appendChild(headerRow);
        ["Activation order", "Flow", "State", "Depends on", "Environment variables", "Depended on by", "Actions"].forEach((heading) => {
          headerRow.appendChild(createElement("th", "", heading));
        });

        const tbody = document.createElement("tbody");
        table.appendChild(tbody);

        const visibleFlows = getFilteredFlows();
        if (visibleFlows.length === 0) {
          const row = document.createElement("tr");
          const cell = document.createElement("td");
          cell.colSpan = 7;
          cell.appendChild(createElement("div", "fdv-empty", state.flows.size === 0 ? "No flow dependency data loaded." : "No flows match the current filter."));
          row.appendChild(cell);
          tbody.appendChild(row);
          return;
        }

        visibleFlows.forEach((flow) => {
          const row = document.createElement("tr");
          row.id = `flow-${flow.id}`;
          if (flow.id === state.selectedFlowId) {
            row.className = "fd-selected";
          }
          if (flow.id === state.highlightedFlowId) {
            row.className = `${row.className} fd-highlight`.trim();
          }

          row.appendChild(renderOrderCell(flow));
          row.appendChild(renderFlowCell(flow));
          row.appendChild(renderStateCell(flow));
          row.appendChild(renderDependencyCell(flow.dependsOn));
          row.appendChild(renderEnvironmentVariableCell(flow.environmentVariableIds));
          row.appendChild(renderDependencyCell(flow.dependedOnBy));
          row.appendChild(renderActionsCell(flow));
          tbody.appendChild(row);
        });
      }

      function jumpToFlow(flowId) {
        state.selectedFlowId = flowId;
        state.highlightedFlowId = flowId;
        state.searchQuery = "";
        window.clearTimeout(state.highlightTimer);
        render();

        window.setTimeout(() => {
          const row = document.getElementById(`flow-${flowId}`);
          if (row) {
            row.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
          }
        }, 0);

        state.highlightTimer = window.setTimeout(() => {
          if (state.highlightedFlowId === flowId) {
            state.highlightedFlowId = null;
            render();
          }
        }, 2200);
      }

      function renderOrderCell(flow) {
        const cell = document.createElement("td");
        if (flow.hasCycle) {
          cell.appendChild(createBadge("Cycle", "error"));
          return cell;
        }

        if (flow.activationOrder === null) {
          cell.appendChild(createElement("span", "fdv-muted", "Not ordered"));
          return cell;
        }

        cell.appendChild(createBadge(String(flow.activationOrder), flow.inSolution ? "on" : "warning"));
        if (!flow.inSolution) {
          cell.appendChild(createElement("div", "fdv-flow-meta", "External"));
        }

        return cell;
      }

      function renderFlowCell(flow) {
        const cell = document.createElement("td");
        const flowButton = createElement("button", "fdv-flow-link", flow.name);
        flowButton.type = "button";
        flowButton.title = "Open flow details";
        flowButton.addEventListener("click", () => {
          void openFlowDetails(flow);
        });
        cell.appendChild(flowButton);

        const details = [
          flow.uniqueName,
          flow.inSolution ? "in selected solution" : "outside selected solution",
          flow.missingFromWorkflowTable ? "missing workflow row" : ""
        ].filter(Boolean).join(" | ");
        cell.appendChild(createElement("div", "fdv-flow-meta", details));
        return cell;
      }

      function renderStateCell(flow) {
        const cell = document.createElement("td");
        cell.appendChild(createBadge(getStateText(flow), isFlowActive(flow) ? "on" : "off"));
        if (flow.statusLabel && flow.statusLabel !== getStateText(flow)) {
          cell.appendChild(createElement("div", "fdv-flow-meta", flow.statusLabel));
        }

        return cell;
      }

      function renderDependencyCell(flowIds) {
        const cell = document.createElement("td");
        const list = createElement("div", "fdv-chip-list");
        cell.appendChild(list);

        const flows = Array.from(flowIds)
          .map((id) => state.flows.get(id))
          .filter(Boolean)
          .sort(compareFlows);

        if (flows.length === 0) {
          list.appendChild(createElement("span", "fdv-muted", "None"));
          return cell;
        }

        flows.forEach((flow) => {
          const chip = createElement("button", `fdv-chip${flow.inSolution ? "" : " fdv-chip-external"}`, `${flow.name}${flow.inSolution ? "" : " (external)"}`);
          chip.type = "button";
          chip.title = flow.inSolution ? "Jump to this flow in the table" : "External flow: not in the selected solution";
          chip.addEventListener("click", () => {
            jumpToFlow(flow.id);
          });
          list.appendChild(chip);
        });

        return cell;
      }

      function renderEnvironmentVariableCell(environmentVariableIds) {
        const cell = document.createElement("td");
        const list = createElement("div", "fdv-chip-list");
        cell.appendChild(list);

        const environmentVariables = Array.from(environmentVariableIds)
          .map((id) => state.environmentVariables.get(id))
          .filter(Boolean)
          .sort(compareEnvironmentVariables);

        if (environmentVariables.length === 0) {
          list.appendChild(createElement("span", "fdv-muted", "None"));
          return cell;
        }

        environmentVariables.forEach((environmentVariable) => {
          const isMissingValue = isEnvironmentVariableValueMissing(environmentVariable);
          const chip = createElement(
            "button",
            `fdv-chip${isMissingValue ? " fdv-chip-error" : ""}`,
            getEnvironmentVariableLabel(environmentVariable)
          );
          chip.type = "button";
          chip.title = `${environmentVariable.schemaName || environmentVariable.id} | ${getEnvironmentVariableValueStatusText(environmentVariable)} | Set current value`;
          chip.addEventListener("click", () => {
            void openEnvironmentVariable(environmentVariable);
          });
          list.appendChild(chip);
        });

        return cell;
      }

      function renderEnvironmentVariableEditor() {
        const editor = state.environmentVariableEditor;
        if (!editor) {
          return;
        }

        const environmentVariable = state.environmentVariables.get(editor.variableId) || createMissingEnvironmentVariable(editor.variableId);
        const overlay = createElement("div", "fdv-dialog-backdrop");
        overlay.addEventListener("click", (event) => {
          if (event.target === overlay && !editor.isSaving) {
            closeEnvironmentVariableEditor();
          }
        });

        const dialog = createElement("section", "fdv-dialog");
        dialog.setAttribute("role", "dialog");
        dialog.setAttribute("aria-modal", "true");
        dialog.setAttribute("aria-labelledby", "fdv-environment-variable-editor-title");
        overlay.appendChild(dialog);

        const header = createElement("div", "fdv-dialog-header");
        dialog.appendChild(header);
        const title = createElement("h2", "fdv-dialog-title", "Set environment variable value");
        title.id = "fdv-environment-variable-editor-title";
        header.appendChild(title);
        header.appendChild(createButton("Close", "secondary", closeEnvironmentVariableEditor, editor.isSaving));

        const body = createElement("div", "fdv-dialog-body");
        dialog.appendChild(body);

        const detailGrid = createElement("div", "fdv-detail-grid");
        body.appendChild(detailGrid);
        appendDetail(detailGrid, "Display name", getEnvironmentVariableLabel(environmentVariable));
        appendDetail(detailGrid, "Name", environmentVariable.schemaName || environmentVariable.id);
        appendDetail(detailGrid, "Type", environmentVariable.typeLabel || getEnvironmentVariableTypeText(environmentVariable));
        appendDetail(detailGrid, "Value status", getEnvironmentVariableValueStatusText(environmentVariable));

        if (editor.multipleActiveValues) {
          body.appendChild(createElement("div", "fdv-message fdv-message-warning", "Multiple active current-value rows exist. Saving updates the first active row returned by Dataverse."));
        }

        if (editor.currentValueHidden) {
          body.appendChild(createElement("div", "fdv-message fdv-message-info", "Secret current values are not displayed. Saving replaces or creates the current value for this variable."));
        }

        if (editor.error) {
          body.appendChild(createElement("div", "fdv-message fdv-message-error", editor.error));
        }

        const valueField = createElement("div", "fdv-field");
        valueField.style.maxWidth = "none";
        body.appendChild(valueField);
        valueField.appendChild(createElement("label", "", "Current value"));

        const valueInput = editor.currentValueHidden ? document.createElement("input") : document.createElement("textarea");
        valueInput.className = editor.currentValueHidden ? "fdv-input" : "fdv-textarea";
        valueInput.disabled = editor.isLoading || editor.isSaving;
        valueInput.placeholder = editor.isLoading ? "Loading current value..." : "Enter current value";
        valueInput.value = editor.value;
        if (editor.currentValueHidden) {
          valueInput.type = "password";
          valueInput.autocomplete = "new-password";
        }
        if (environmentVariable.typeCode === ENVIRONMENT_VARIABLE_TYPE_NUMBER) {
          valueInput.inputMode = "decimal";
        }
        valueInput.addEventListener("input", () => {
          editor.value = valueInput.value;
          editor.error = "";
        });
        valueField.appendChild(valueInput);

        const footer = createElement("div", "fdv-dialog-footer");
        dialog.appendChild(footer);
        footer.appendChild(createButton("Open Default Solution list", "secondary", () => {
          void openEnvironmentVariablesList();
        }, editor.isLoading || editor.isSaving));

        const footerActions = createElement("div", "fdv-actions");
        footer.appendChild(footerActions);
        footerActions.appendChild(createButton("Cancel", "secondary", closeEnvironmentVariableEditor, editor.isSaving));
        footerActions.appendChild(createButton(editor.isSaving ? "Saving..." : "Save current value", "primary", () => {
          void saveEnvironmentVariableEditor();
        }, editor.isLoading || editor.isSaving));

        app.appendChild(overlay);

        if (!editor.isLoading && !editor.isSaving) {
          window.setTimeout(() => valueInput.focus(), 0);
        }
      }

      function renderActionsCell(flow) {
        const cell = document.createElement("td");
        const actions = createElement("div", "fdv-actions");
        cell.appendChild(actions);

        if (!state.enableActivationCommands) {
          actions.appendChild(createElement("span", "fdv-muted", "Commands disabled"));
          return cell;
        }

        if (!flow.inSolution) {
          actions.appendChild(createElement("span", "fdv-muted", "External flow"));
          return cell;
        }

        const turnOn = !isFlowActive(flow);
        actions.appendChild(createButton(turnOn ? "Turn on" : "Turn off", turnOn ? "primary" : "danger", () => {
          void setSingleFlowState(flow, turnOn);
        }, state.isLoading || state.isWorking));

        return cell;
      }

      function getFilteredFlows() {
        const query = state.searchQuery.trim().toLowerCase();
        const flows = getSortedFlows();
        if (!query) {
          return flows;
        }

        return flows.filter((flow) => {
          const dependencyNames = Array.from(flow.dependsOn).concat(Array.from(flow.dependedOnBy))
            .map((id) => {
              const dependency = state.flows.get(id);
              return dependency ? dependency.name : "";
            })
            .join(" ");
          const environmentVariableNames = Array.from(flow.environmentVariableIds)
            .map((id) => state.environmentVariables.get(id))
            .filter(Boolean)
            .map((environmentVariable) => `${environmentVariable.displayName} ${environmentVariable.schemaName}`)
            .join(" ");
          return `${flow.name} ${flow.uniqueName} ${dependencyNames} ${environmentVariableNames}`.toLowerCase().includes(query);
        });
      }

      function getSortedFlows() {
        return Array.from(state.flows.values()).sort((left, right) => {
          if (left.inSolution !== right.inSolution) {
            return left.inSolution ? -1 : 1;
          }

          const leftOrder = left.activationOrder || Number.MAX_SAFE_INTEGER;
          const rightOrder = right.activationOrder || Number.MAX_SAFE_INTEGER;
          if (leftOrder !== rightOrder) {
            return leftOrder - rightOrder;
          }

          if (left.hasCycle !== right.hasCycle) {
            return left.hasCycle ? 1 : -1;
          }

          return compareFlows(left, right);
        });
      }

      function appendStat(host, value, label) {
        const stat = createElement("div", "fdv-stat");
        stat.appendChild(createElement("div", "fdv-stat-value", value));
        stat.appendChild(createElement("div", "fdv-stat-label", label));
        host.appendChild(stat);
      }

      function appendDetail(host, label, value) {
        const detail = createElement("div", "fdv-detail");
        detail.appendChild(createElement("div", "fdv-detail-label", label));
        detail.appendChild(createElement("div", "fdv-detail-value", value || "-"));
        host.appendChild(detail);
      }

      function createButton(label, variant, onClick, disabled) {
        const button = createElement("button", `fdv-button fdv-button-${variant}`, label);
        button.type = "button";
        button.disabled = !!disabled;
        button.addEventListener("click", onClick);
        return button;
      }

      function createBadge(text, variant) {
        return createElement("span", `fdv-badge fdv-badge-${variant}`, text);
      }

      function createElement(tagName, className, textContent) {
        const element = document.createElement(tagName);
        if (className) {
          element.className = className;
        }
        if (textContent !== undefined) {
          element.textContent = textContent;
        }
        return element;
      }

      async function confirmAction(title, text, confirmButtonLabel) {
        const xrm = getXrm();
        if (xrm && xrm.Navigation && typeof xrm.Navigation.openConfirmDialog === "function") {
          const result = await xrm.Navigation.openConfirmDialog({
            title,
            text,
            confirmButtonLabel,
            cancelButtonLabel: "Cancel"
          });
          return result.confirmed;
        }

        return window.confirm(`${title}\n\n${text}`);
      }

      function mapSolution(record) {
        return {
          solutionId: normalizeGuid(readString(record, "solutionid")) || "",
          uniqueName: readString(record, "uniquename"),
          friendlyName: readString(record, "friendlyname"),
          version: readString(record, "version"),
          isManaged: readBoolean(record, "ismanaged")
        };
      }

      function mapFlow(record, inSolution) {
        const id = normalizeGuid(readString(record, "workflowid")) || "";
        const name = readString(record, "name") || readString(record, "uniquename") || id;
        return {
          id,
          name,
          uniqueName: readString(record, "uniquename"),
          resourceId: normalizeGuid(readString(record, "resourceid")) || "",
          workflowIdUnique: normalizeGuid(readString(record, "workflowidunique")) || "",
          stateCode: readNumber(record, "statecode"),
          statusCode: readNumber(record, "statuscode"),
          stateLabel: readFormattedString(record, "statecode"),
          statusLabel: readFormattedString(record, "statuscode"),
          modifiedOn: readString(record, "modifiedon"),
          inSolution,
          dependsOn: new Set(),
          dependedOnBy: new Set(),
          environmentVariableIds: new Set(),
          activationOrder: null,
          hasCycle: false,
          missingFromWorkflowTable: false
        };
      }

      function mapEnvironmentVariable(record) {
        const id = normalizeGuid(readString(record, "environmentvariabledefinitionid")) || "";
        const schemaName = readString(record, "schemaname");
        const displayName = readString(record, "displayname");
        return {
          id,
          schemaName,
          displayName,
          typeCode: readNumber(record, "type"),
          typeLabel: readFormattedString(record, "type"),
          currentValueId: "",
          hasDefaultValue: false,
          hasCurrentValue: false,
          hasValue: false,
          missingFromDefinitionTable: false
        };
      }

      function mapEnvironmentVariableValue(record, includeValue) {
        return {
          id: normalizeGuid(readString(record, "environmentvariablevalueid")) || "",
          definitionId: normalizeGuid(
            readString(record, "_environmentvariabledefinitionid_value") || readString(record, "environmentvariabledefinitionid")
          ) || "",
          schemaName: readString(record, "schemaname"),
          value: includeValue ? readString(record, "value") : "",
          hasValue: includeValue ? hasNonEmptyValue(record.value) : false,
          stateCode: readNumber(record, "statecode"),
          statusCode: readNumber(record, "statuscode"),
          modifiedOn: readString(record, "modifiedon")
        };
      }

      function createMissingEnvironmentVariable(id) {
        return {
          id,
          schemaName: "",
          displayName: `Unknown environment variable ${id}`,
          typeCode: null,
          typeLabel: "Unknown",
          currentValueId: "",
          hasDefaultValue: false,
          hasCurrentValue: false,
          hasValue: false,
          missingFromDefinitionTable: true
        };
      }

      function createMissingFlow(id, inSolution) {
        return {
          id,
          name: `Unknown flow ${id}`,
          uniqueName: "",
          resourceId: "",
          workflowIdUnique: "",
          stateCode: null,
          statusCode: null,
          stateLabel: "Unknown",
          statusLabel: "Unknown",
          modifiedOn: "",
          inSolution,
          dependsOn: new Set(),
          dependedOnBy: new Set(),
          environmentVariableIds: new Set(),
          activationOrder: null,
          hasCycle: false,
          missingFromWorkflowTable: true
        };
      }

      function isFlowActive(flow) {
        return flow.stateCode === ACTIVE_STATE || flow.statusCode === ACTIVE_STATUS;
      }

      function getStateText(flow) {
        if (flow.stateLabel) {
          return flow.stateLabel;
        }
        if (flow.stateCode === ACTIVE_STATE) {
          return "On";
        }
        if (flow.stateCode === DRAFT_STATE) {
          return "Off";
        }
        return "Unknown";
      }

      function getSolutionLabel(solution) {
        const displayName = solution.friendlyName || solution.uniqueName || solution.solutionId;
        return solution.version ? `${displayName} (${solution.version})` : displayName;
      }

      function setMessage(severity, text) {
        state.message = { severity, text };
        render();
      }

      function compareFlows(left, right) {
        return left.name.localeCompare(right.name, undefined, { sensitivity: "base" }) || left.id.localeCompare(right.id);
      }

      function compareEnvironmentVariables(left, right) {
        return getEnvironmentVariableLabel(left).localeCompare(getEnvironmentVariableLabel(right), undefined, { sensitivity: "base" })
          || left.id.localeCompare(right.id);
      }

      function getEnvironmentVariableLabel(environmentVariable) {
        return environmentVariable.displayName || environmentVariable.schemaName || environmentVariable.id;
      }

      function getEnvironmentVariableTypeText(environmentVariable) {
        if (environmentVariable.typeCode === ENVIRONMENT_VARIABLE_TYPE_NUMBER) {
          return "Number";
        }
        if (environmentVariable.typeCode === ENVIRONMENT_VARIABLE_TYPE_SECRET) {
          return "Secret";
        }

        return "Environment variable";
      }

      function isEnvironmentVariableValueMissing(environmentVariable) {
        return environmentVariable.missingFromDefinitionTable || !environmentVariable.hasValue;
      }

      function getEnvironmentVariableValueStatusText(environmentVariable) {
        if (environmentVariable.missingFromDefinitionTable) {
          return "Definition row not found";
        }
        if (environmentVariable.hasCurrentValue) {
          return "Current value set";
        }
        if (environmentVariable.hasDefaultValue) {
          return "Default value set";
        }

        return "Missing value";
      }

      function getMissingEnvironmentVariableCount(environmentVariableMap = state.environmentVariables, dependencies = state.environmentVariableDependencies) {
        const environmentVariableIds = distinctNormalizedGuids(dependencies.map((dependency) => dependency.environmentVariableId));
        return environmentVariableIds
          .map((id) => environmentVariableMap.get(id))
          .filter(Boolean)
          .filter(isEnvironmentVariableValueMissing)
          .length;
      }

      function buildEnvironmentVariableValueSchemaName(environmentVariable) {
        const baseName = (environmentVariable.schemaName || `environmentvariable_${environmentVariable.id.replace(/-/g, "")}`)
          .replace(/[^A-Za-z0-9_]/g, "_");
        const suffix = "_Value";
        return `${baseName.slice(0, 100 - suffix.length)}${suffix}`;
      }

      function readString(record, fieldName) {
        const value = record[fieldName];
        return typeof value === "string" ? value : "";
      }

      function readFormattedString(record, fieldName) {
        return readString(record, `${fieldName}@OData.Community.Display.V1.FormattedValue`);
      }

      function readNumber(record, fieldName) {
        const value = record[fieldName];
        if (typeof value === "number") {
          return value;
        }
        if (typeof value === "string") {
          const parsed = Number(value);
          return Number.isFinite(parsed) ? parsed : null;
        }
        return null;
      }

      function readBoolean(record, fieldName) {
        const value = record[fieldName];
        return typeof value === "boolean" ? value : false;
      }

      function hasNonEmptyValue(value) {
        return value !== null && value !== undefined && String(value).trim() !== "";
      }

      function distinctNormalizedGuids(values) {
        const ids = new Set();
        values.forEach((value) => {
          const id = normalizeGuid(value);
          if (id) {
            ids.add(id);
          }
        });
        return Array.from(ids);
      }

      function normalizeGuid(value) {
        if (!value) {
          return null;
        }

        const normalized = String(value).trim().replace(/[{}]/g, "").toLowerCase();
        return /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(normalized)
          ? normalized
          : null;
      }

      function buildInCondition(attributeName, values) {
        return [
          `      <condition attribute="${attributeName}" operator="in">`,
          ...values.map((value) => `        <value>${escapeXml(value)}</value>`),
          "      </condition>"
        ].join("");
      }

      function toFetchXmlQuery(fetchXml) {
        return `?fetchXml=${encodeURIComponent(fetchXml)}`;
      }

      function chunk(values, size) {
        const chunks = [];
        for (let index = 0; index < values.length; index += size) {
          chunks.push(values.slice(index, index + size));
        }
        return chunks;
      }

      function escapeODataString(value) {
        return value.replace(/'/g, "''");
      }

      function escapeXml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&apos;");
      }

      function getErrorMessage(error) {
        if (error instanceof Error) {
          return error.message;
        }
        if (error && typeof error === "object" && typeof error.message === "string") {
          return error.message;
        }
        return String(error);
      }

      function getFlowStateErrorMessage(error, turnOn) {
        const message = getErrorMessage(error);
        if (!turnOn) {
          return message;
        }

        const environmentVariableName = getMissingEnvironmentVariableName(message);
        if (!environmentVariableName) {
          return message;
        }

        return `Power Automate blocked activation because environment variable "${environmentVariableName}" does not have a current value in this environment. Set the environment variable value, then retry. Details: ${message}`;
      }

      function getMissingEnvironmentVariableName(message) {
        if (!message.includes("XrmEnvironmentVariableAttributeNotFound")) {
          return "";
        }

        const match = message.match(/environment variable '([^']+)'/i);
        return match ? match[1] : "";
      }
    })();
  </script>
</body>
</html>
